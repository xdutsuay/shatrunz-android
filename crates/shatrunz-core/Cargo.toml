[package]
name = "shatrunz-core"
edition.workspace = true
version.workspace = true

[dependencies]
# `std::time::Instant::now()` panics on wasm32-unknown-unknown; web-time
# re-exports std on native and uses `performance.now()` in the browser/worker.
web-time = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
